# Added to the Pattern CR only for a manual CI cluster run.
# The normal prod values remain the base for this cluster group.
clusterGroup:
  namespaces:
    rhdh:
      disabled: true
    rhdh-operator:
      disabled: true
    saw-portal:
      disabled: true
    redhat-ods-operator:
      disabled: true

  subscriptions:
    rhdh:
      disabled: true
    openshift-pipelines:
      disabled: true
    openshift-ai:
      disabled: true

  applications:
    openshell-rhdh:
      disabled: true
    openshell-keycloak:
      extraValueFiles:
        - /overrides/keycloak-ci.yaml
    saw-users:
      extraValueFiles:
        - /overrides/saw-users-ci.yaml

  imperative:
    jobs:
      - name: saw-ingress-ca
        playbook: ansible/playbooks/saw-ingress-ca.yaml
        timeout: 300
